[project]
name = "sepsis-early-warning"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Fardeen", email = "frdn.khnn@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "lightgbm>=4.7.0",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "pandas>=3.1.0",
    "scikit-learn>=1.9.1",
]

[project.scripts]
sepsis-early-warning = "sepsis_early_warning:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "jupyterlab>=4.6.4",
]
